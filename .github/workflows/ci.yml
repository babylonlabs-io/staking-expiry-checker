name: ci

on:
  pull_request:
    branches:
    - '**'

jobs:
  lint_test:
    uses: babylonlabs-io/.github/.github/workflows/reusable_go_lint_test.yml@cfbd5e4db5e575edf77a160fe533918c4f3a4498  # v0.13.2
    with:
      go-version: '1.24.3'
      go-lint-version: 'v1.64.8'
      run-unit-tests: true
      run-integration-tests: false
      run-lint: true
      run-build: true
      run-gosec: true
      gosec-args: "-no-fail ./..."

  docker_pipeline:
    permissions:
      contents: read         # Required by reusable workflow
      id-token: write        # Required for AWS OIDC
      security-events: write # Required for Trivy SARIF uploads
    uses: babylonlabs-io/.github/.github/workflows/reusable_docker_pipeline.yml@d2299e834fcbaca4bf2db043a2939798043d5951 # v0.16.1
    secrets: inherit
    with:
      publish: false
      dockerfile: ./contrib/images/staking-expiry-checker/Dockerfile
